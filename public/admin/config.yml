backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "tasks"
    label: "Tugas"
    label_singular: "Tugas"
    folder: "content/tasks"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul Tugas", name: "title", widget: "string", required: true}
      - {label: "Mata Kuliah", name: "subject", widget: "string", required: true}
      - {label: "Ruangan", name: "room", widget: "string", required: true}
      - {label: "Tanggal Diberikan", name: "date", widget: "date", required: true}
      - {label: "Deadline", name: "deadline", widget: "date", required: true}
      - {label: "Dosen Pengampu", name: "lecturer", widget: "string", required: true}
      - {label: "Tipe Tugas", name: "type", widget: "select", options: ["Individu", "Kelompok"], default: "Individu"}
      - {label: "Deskripsi", name: "description", widget: "text", required: true}
      - {label: "Link Tugas", name: "link", widget: "string"}
      - {label: "Ketua Kelas", name: "classLeader", widget: "string", required: true}
      - {label: "WhatsApp", name: "whatsapp", widget: "string", required: true}
      - {label: "ID", name: "id", widget: "number", required: true}

  - name: "groups"
    label: "Kelompok"
    label_singular: "Kelompok"
    folder: "content/groups"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Nama Kelompok", name: "title", widget: "string", required: true}
      - {label: "Mata Kuliah", name: "subject", widget: "string", required: true}
      - {label: "Dosen", name: "lecturer", widget: "string", required: true}
      - {label: "Ruangan", name: "room", widget: "string", required: true}
      - {label: "Link Grup WhatsApp", name: "whatsappGroup", widget: "string", required: true}
      - {label: "Link Google Drive", name: "driveLink", widget: "string", required: true}
      - {label: "ID", name: "id", widget: "number", required: true}

  - name: "pages"
    label: "Halaman"
    files:
      - file: "content/pages/home.md"
        label: "Beranda"
        name: "home"
        fields:
          - {label: "Judul", name: "title", widget: "string"}
          - {label: "Subjudul", name: "subtitle", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Stats", name: "stats", widget: "list", fields: [
              {label: "Angka", name: "number", widget: "string"},
              {label: "Label", name: "label", widget: "string"}
            ]}
