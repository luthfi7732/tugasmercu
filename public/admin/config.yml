backend:
  name: git-gateway
  branch: master

media_folder: static/uploads
public_folder: /uploads

# Site settings
site_url: https://mercutugas.netlify.app
display_url: https://mercutugas.netlify.app
logo_url: https://mercutugas.netlify.app/logo.png

# Editorial workflow
publish_mode: editorial_workflow

# Collections
collections:
  - name: "tasks"
    label: "📝 Tugas & Assignment"
    label_singular: "Tugas"
    description: "Kelola tugas individu dan kelompok untuk mahasiswa"
    folder: "content/tasks"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    preview_path: "tugas/{{slug}}"
    fields:
      - {label: "Judul Tugas", name: "title", widget: "string", required: true}
      - {label: "Mata Kuliah", name: "subject", widget: "string", required: true}
      - {label: "Ruangan", name: "room", widget: "string", required: true}
      - {label: "Tanggal Diberikan", name: "date", widget: "date", required: true, date_format: "YYYY-MM-DD"}
      - {label: "Deadline", name: "deadline", widget: "date", required: true, date_format: "YYYY-MM-DD"}
      - {label: "Dosen Pengampu", name: "lecturer", widget: "string", required: true}
      - {
          label: "Tipe Tugas",
          name: "type",
          widget: "select",
          options: ["Individu", "Kelompok"],
          required: true,
          default: "Individu"
        }
      - {label: "Deskripsi", name: "description", widget: "text", required: true}
      - {
          label: "Link Google Classroom",
          name: "link",
          widget: "string",
          required: false,
          hint: "Opsional - URL Google Classroom atau Google Drive"
        }
      - {label: "Ketua Kelas", name: "classLeader", widget: "string", required: true}
      - {
          label: "Nomor WhatsApp",
          name: "whatsapp",
          widget: "string",
          required: true,
          hint: "Format: 08xxxxxxxxxx"
        }

  - name: "groups"
    label: "👥 Kelompok Mata Kuliah"
    label_singular: "Kelompok"
    description: "Kelola informasi kelompok untuk setiap mata kuliah"
    folder: "content/groups"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    preview_path: "kelompok/{{slug}}"
    fields:
      - {label: "Mata Kuliah", name: "subject", widget: "string", required: true}
      - {label: "Dosen Pengampu", name: "lecturer", widget: "string", required: true}
      - {label: "Ruangan", name: "room", widget: "string", required: true}
      - {
          label: "Link Google Drive",
          name: "driveLink",
          widget: "string",
          required: true,
          hint: "URL folder Google Drive kelompok"
        }
      - {
          label: "Link Grup WhatsApp",
          name: "whatsappGroup",
          widget: "string",
          required: true,
          hint: "URL grup WhatsApp mata kuliah"
        }

  - name: "pages"
    label: "📄 Halaman Statis"
    files:
      - file: "content/tasks.json"
        label: "Daftar Tugas"
        name: "tasks_list"
        fields:
          - {
              label: "Daftar Tugas",
              name: "tasks",
              widget: "list",
              fields:
                [
                  {label: "Judul", name: "title", widget: "string"},
                  {label: "Mata Kuliah", name: "subject", widget: "string"},
                  {label: "Ruangan", name: "room", widget: "string"},
                  {label: "Tanggal", name: "date", widget: "date"},
                  {label: "Deadline", name: "deadline", widget: "date"},
                  {label: "Dosen", name: "lecturer", widget: "string"},
                  {label: "Tipe", name: "type", widget: "select", options: ["Individu", "Kelompok"]},
                  {label: "Deskripsi", name: "description", widget: "text"},
                  {label: "Link", name: "link", widget: "string"},
                  {label: "Ketua Kelas", name: "classLeader", widget: "string"},
                  {label: "WhatsApp", name: "whatsapp", widget: "string"}
                ]
            }

      - file: "content/groups.json"
        label: "Daftar Kelompok"
        name: "groups_list"
        fields:
          - {
              label: "Daftar Kelompok",
              name: "groups",
              widget: "list",
              fields:
                [
                  {label: "Mata Kuliah", name: "subject", widget: "string"},
                  {label: "Dosen", name: "lecturer", widget: "string"},
                  {label: "Ruangan", name: "room", widget: "string"},
                  {label: "Drive Link", name: "driveLink", widget: "string"},
                  {label: "WhatsApp Group", name: "whatsappGroup", widget: "string"}
                ]
            }
