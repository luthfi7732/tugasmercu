[build]
  publish = "dist"
  command = "npm run cms:build"

[build.environment]
  NODE_VERSION = "18"

# Netlify Identity and Git Gateway
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Redirects for SPA and admin
[[redirects]]
  from = "/admin/*"
  to = "/admin/index-fixed.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for Netlify Identity
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Environment variables
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "development"

[context.branch-deploy.environment]
  NODE_ENV = "development"

# Git Gateway settings
[[redirects]]
  from = "/.netlify/git/*"
  to = "https://api.github.com/repos/Luthfiiiiiiau/mercutugas/git/:splat"
  status = 200
  headers = {Authorization = "Bearer YOUR_GITHUB_TOKEN"}

# Netlify Functions (if needed)
[functions]
  directory = "netlify/functions"
