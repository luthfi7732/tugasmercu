[build]
  publish = "dist"
  command = "npm run cms:build"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index-fixed.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Redirect for config.yml
[[redirects]]
  from = "/admin/config.yml"
  to = "/config.yml"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

# Content Security Policy - Updated for CMS
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com; frame-ancestors 'none';"

# Specific CSP for admin interface
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com; frame-ancestors 'none';"
